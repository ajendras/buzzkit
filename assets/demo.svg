<svg xmlns="http://www.w3.org/2000/svg" width="900" height="572" viewBox="0 0 900 572" role="img" aria-label="BuzzKit — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="572" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="572" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">BuzzKit — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#6ed8b6">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 1.26s steps(28) 0.60s forwards" fill="#e5e7eb">mint install buzzkit/buzzkit</text>
<text x="50" y="100" class="l" style="animation:show .01s 2.16s forwards" fill="#94a3b8">Installing buzzkit from https://github.com/buzzkit/buzzkit</text>
<text x="50" y="126" class="l" style="animation:show .01s 2.38s forwards" fill="#94a3b8">✅ Installed to ~/.mint/bin/haptikit</text>
<text x="28" y="178" class="l" style="animation:show .01s 2.95s forwards"><tspan fill="#6ed8b6">❯</tspan></text><text x="50" y="178" class="l ty" style="animation:show .01s 2.95s forwards,type 1.76s steps(39) 2.95s forwards" fill="#e5e7eb">haptikit play &apos;sine(440, 1.5).amp(0.7)&apos;</text>
<text x="50" y="204" class="l" style="animation:show .01s 5.01s forwards" fill="#94a3b8">Loaded pattern: sine wave 440 Hz for 1.5 s</text>
<text x="50" y="230" class="l" style="animation:show .01s 5.23s forwards" fill="#94a3b8">Playing on trackpad motor...</text>
<text x="50" y="256" class="l" style="animation:show .01s 5.45s forwards" fill="#94a3b8">✅ Pattern completed</text>
<text x="28" y="308" class="l" style="animation:show .01s 6.02s forwards"><tspan fill="#6ed8b6">❯</tspan></text><text x="50" y="308" class="l ty" style="animation:show .01s 6.02s forwards,type 1.80s steps(40) 6.02s forwards" fill="#e5e7eb">haptikit convert tone.wav --duration 2.0</text>
<text x="50" y="334" class="l" style="animation:show .01s 8.12s forwards" fill="#94a3b8">Analyzed 88200 samples → 68 haptic events</text>
<text x="50" y="360" class="l" style="animation:show .01s 8.34s forwards" fill="#94a3b8">Saved pattern to tone.haptic</text>
<text x="50" y="386" class="l" style="animation:show .01s 8.56s forwards" fill="#94a3b8">Use &apos;haptikit play tone.haptic&apos; to test</text>
<text x="28" y="438" class="l" style="animation:show .01s 9.13s forwards"><tspan fill="#6ed8b6">❯</tspan></text><text x="50" y="438" class="l ty" style="animation:show .01s 9.13s forwards,type 1.53s steps(34) 9.13s forwards" fill="#e5e7eb">open Examples/HapticPlayground.app</text>
<text x="50" y="464" class="l" style="animation:show .01s 10.96s forwards" fill="#94a3b8">Opened SwiftUI playground</text>
<text x="50" y="490" class="l" style="animation:show .01s 11.18s forwards" fill="#94a3b8">Drag sliders → feel live sine, square and sawtooth haptics on trackpad</text>
<g class="l" style="animation:show .01s 11.75s forwards"><text x="28" y="542" fill="#6ed8b6">❯</text><rect class="cur" x="50" y="527" width="10" height="18" fill="#e5e7eb"/></g>
</svg>
